name: Build StudyMate AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove invalid wrapper jar if present
        run: rm -f gradle/wrapper/gradle-wrapper.jar

      - name: Prepare environment configuration
        run: |
          cat << 'EOF' > .env
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'dummy_api_key_for_build' }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://dummy.supabase.co' }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'dummy_anon_key_for_build' }}
          SERPER_API_KEY=${{ secrets.SERPER_API_KEY || 'dummy_serper_key' }}
          ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY || 'dummy_elevenlabs_key' }}
          ELEVENLABS_VOICE_ID=${{ secrets.ELEVENLABS_VOICE_ID || '21m00Tcm4TlvDq8ikWAM' }}
          ELEVENLABS_MODEL_ID=${{ secrets.ELEVENLABS_MODEL_ID || 'eleven_multilingual_v2' }}
          EOF
          cat << 'EOF' > .env.example
          GEMINI_API_KEY=dummy_api_key_for_build
          SUPABASE_URL=https://dummy.supabase.co
          SUPABASE_ANON_KEY=dummy_anon_key_for_build
          SERPER_API_KEY=dummy_serper_key
          ELEVENLABS_API_KEY=dummy_elevenlabs_key
          ELEVENLABS_VOICE_ID=21m00Tcm4TlvDq8ikWAM
          ELEVENLABS_MODEL_ID=eleven_multilingual_v2
          EOF

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyMate-AI-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

